repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-added-large-files
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.0
  hooks:
  - id: ruff
    args:
    - --fix
    - --exit-non-zero-on-fix
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 'v1.11.1' # Use the latest stable tag
  hooks:
    - id: mypy
      # Removed args, using entry instead
      entry: env MYPYPATH=src mypy --config-file=pyproject.toml --namespace-packages --explicit-package-bases
      language: python # Use system python if possible
      types: [python]
      # Pass arguments to load config and handle src-layout
      additional_dependencies: [
          # Core Pydantic types
          "pydantic-core>=2.14.6",
          "pydantic>=2.0",
          "typing-extensions>=4.6.0",
          # Project dependencies needed for type checking
          "fastapi",
          "python-dotenv",
          "mcp",
          "pydantic_ai",
          "uvicorn",
      ]
